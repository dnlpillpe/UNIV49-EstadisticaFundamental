name: Compilar APK

# Genera el APK instalable de Estadística Fundamental.
#
# Firma: el APK de release se firma con la clave de depuración que genera
# `flutter create`. Es instalable para pruebas de campo y NO es publicable en
# Google Play. Los pasos para la firma real están en docs/05_Despliegue_y_CI_CD.md.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tipo:
        description: "Tipo de compilación"
        required: true
        default: "release"
        type: choice
        options: [release, debug]

env:
  APP_NAME: estadistica_fundamental

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar plataformas nativas
        run: |
          flutter create \
            --platforms=android,ios \
            --project-name estadistica_fundamental \
            --org com.estadisticafundamental \
            --description "Estadística Fundamental" \
            .

      - name: Restaurar el código del repositorio
        run: |
          git checkout -- lib pubspec.yaml analysis_options.yaml test assets || true
          # `flutter create` añade su plantilla test/widget_test.dart, que
          # referencia una clase `MyApp` que este proyecto no tiene y rompe el
          # análisis. `git checkout` restaura lo versionado pero no borra lo
          # que no lo está: se limpia aquí lo generado en lib/ y test/.
          git clean -fd lib test

      - name: Descargar dependencias
        run: flutter pub get

      # El icono se genera desde assets/icon/app_icon.png, que a su vez produce
      # el script tool/generate_icon.py con el mismo diseño que la marca de la
      # app. Este paso escribe los mipmaps de Android y el AppIcon de iOS.
      - name: Generar los iconos de la aplicación
        run: dart run flutter_launcher_icons

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Compilar APK de release
        if: ${{ github.event.inputs.tipo != 'debug' }}
        run: flutter build apk --release --split-per-abi

      - name: Compilar APK universal de release
        if: ${{ github.event.inputs.tipo != 'debug' }}
        run: flutter build apk --release

      - name: Compilar APK de depuración
        if: ${{ github.event.inputs.tipo == 'debug' }}
        run: flutter build apk --debug

      - name: Renombrar los APK
        run: |
          cd build/app/outputs/flutter-apk
          for f in *.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${APP_NAME}-${f}"
          done
          ls -lh

      - name: Publicar los APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-estadistica-fundamental
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Crear la release de GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          body: |
            ## Estadística Fundamental

            Aplicación educativa universitaria para aprender a **interpretar**
            datos, no solo a calcularlos.

            **Instalación:** descarga el APK que corresponda a tu dispositivo
            (`arm64-v8a` sirve para casi todos los móviles actuales; el APK sin
            sufijo funciona en cualquiera) y permite la instalación desde
            orígenes desconocidos.

            > Este APK está firmado con la clave de depuración: es válido para
            > pruebas de campo y no es publicable en Google Play.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
